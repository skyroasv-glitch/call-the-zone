name: Top up daily puzzles

# The daily game is static JSON in public/puzzles. Without this job the runway
# eventually empties and every visitor silently drops to the practice set, so
# this keeps a month of real pitches ahead at all times.
#
# Deliberately generous: it runs every day but only writes the days that are
# missing, so a failed run costs nothing as long as it is fixed inside the
# runway. That is the point of keeping 30 days rather than generating "today" —
# the client keys off the player's LOCAL date, and a puzzle goes live in UTC+14
# about 26 hours before it does in UTC-11.

on:
  schedule:
    # 07:20 UTC — after Statcast has posted the previous day and well clear of
    # any timezone's midnight rollover.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to keep filled"
        required: false
        default: "30"

concurrency:
  group: puzzles
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    permissions:
      # The job's whole output is a commit of generated JSON.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r data-pipeline/requirements.txt

      - name: Generate missing puzzles
        run: python data-pipeline/topup.py --days "${{ github.event.inputs.days || 30 }}"

      - name: Check what changed
        id: diff
        run: |
          if [ -n "$(git status --porcelain public/puzzles)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated:"
            git status --porcelain public/puzzles
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Runway already full — nothing to commit."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/puzzles
          git commit -m "Top up daily puzzles through $(date -u -d '+30 days' +%F)"
          git push
